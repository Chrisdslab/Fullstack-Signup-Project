<div style="max-width: 400px; margin: 50px auto; font-family: Arial, sans-serif;">
  <h2>Sign Up</h2>
  
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    
    <div style="margin-bottom: 15px;">
      <label>First Name</label><br>
      <input type="text" formControlName="firstName" style="width: 100%; padding: 8px;">
      <small *ngIf="signupForm.get('firstName')?.errors?.['pattern']" style="color: red;">Only alphabets allowed.</small>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Last Name</label><br>
      <input type="text" formControlName="lastName" style="width: 100%; padding: 8px;">
      <small *ngIf="signupForm.get('lastName')?.errors?.['pattern']" style="color: red;">Only alphabets allowed.</small>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Email</label><br>
      <input type="email" formControlName="email" style="width: 100%; padding: 8px;">
      <small *ngIf="signupForm.get('email')?.errors?.['email']" style="color: red;">Invalid email format.</small>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Phone Number</label><br>
      <input type="text" formControlName="phone" placeholder="+XXXXXXXXXXXXX or XXXXXXXXXX" style="width: 100%; padding: 8px;">
      <small *ngIf="signupForm.get('phone')?.errors?.['pattern']" style="color: red;">Invalid phone format. No starting 0.</small>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password</label><br>
      <input type="password" formControlName="password" style="width: 100%; padding: 8px;">
      <small *ngIf="signupForm.get('password')?.errors?.['pattern']" style="color: red;">Min 6 chars, 1 letter, 1 number, 1 special (@#$&!).</small>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Repeat Password</label><br>
      <input type="password" formControlName="repeatPassword" style="width: 100%; padding: 8px;">
      <small *ngIf="signupForm.errors?.['passwordMismatch'] && signupForm.get('repeatPassword')?.touched" style="color: red;">Passwords do not match.</small>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Pincode</label><br>
      <input type="text" formControlName="pincode" style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" [disabled]="signupForm.invalid" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer;">
      Submit
    </button>
    <br><br>
    <a routerLink="/login">Already have an account? Login here.</a>
  </form>
</div>
